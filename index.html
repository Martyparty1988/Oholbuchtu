<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Srandovní soukromá mobilní PWA AR appka pro porovnání šablon, vibe score a lehce drzé verdikty. Kamera běží pouze lokálně v zařízení.">
    <title>Ohol Buchtu Studio</title>

    <link rel="manifest" href="%BASE_URL%manifest.json">
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg">
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg">
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <main class="app-shell" aria-labelledby="app-title">
        <section class="top-panel">
            <div class="brand-block">
                <p class="eyebrow">srandovní AR PWA</p>
                <h1 id="app-title">Ohol Buchtu</h1>
            </div>

            <div class="fun-panel compact" aria-live="polite">
                <div class="fun-panel-header">
                    <span id="template-label" class="template-pill">Decent mód</span>
                    <strong id="template-vibe" class="fun-score">Vibe 0/10</strong>
                </div>
                <div class="vibe-meter" aria-hidden="true">
                    <span id="vibe-fill"></span>
                </div>
                <p id="template-joke" class="fun-joke">Vyber šablonu a appka tě s láskou zhodnotí.</p>
            </div>
        </section>

        <section class="stage-card" aria-label="AR náhled">
            <div id="video-container" class="video-container mirrored">
                <video id="video" autoplay playsinline muted aria-label="Živý náhled kamery"></video>
                <canvas id="canvas" class="overlay" aria-hidden="true"></canvas>
                <div id="empty-state" class="empty-state">
                    <strong>Kamera je vypnutá</strong>
                    <span>Klepni na Start. iPhone má rád slušné vychování.</span>
                </div>
            </div>
        </section>

        <section class="bottom-panel" aria-label="Ovládání aplikace">
            <label class="field compact-field" for="template-select">
                <span>Šablona</span>
                <select id="template-select">
                    <option value="none">Žádná šablona</option>
                    <option value="full">Full / lesní království</option>
                    <option value="brazilian">Brazilian / aero mód</option>
                    <option value="landing-strip">Landing Strip / runway ready</option>
                    <option value="triangle">Triangle / geometrická odvaha</option>
                    <option value="heart">Heart / romantický chaos</option>
                    <option value="lightning">Lightning / pojistky ven</option>
                    <option value="star">Star / main character</option>
                </select>
            </label>

            <div class="button-row camera-row">
                <button id="start-camera" class="button primary" type="button">Start</button>
                <button id="stop-camera" class="button" type="button" disabled>Stop</button>
                <button id="switch-camera" class="button ghost" type="button" disabled>Zadní kamera</button>
            </div>

            <div class="button-row fun-row">
                <button id="random-template" class="button fun" type="button">🎲 Random</button>
                <button id="boost-vibe" class="button fun ghost" type="button">⚡ Boost</button>
                <button id="chaos-mode" class="button fun ghost" type="button">🪩 Chaos</button>
            </div>

            <div class="footer-controls">
                <label class="toggle">
                    <input id="mirror-toggle" type="checkbox" checked>
                    <span>Zrcadlit selfie</span>
                </label>
                <p id="status" class="status" role="status" aria-live="polite">Připraveno. Vyber šablonu nebo zapni kameru.</p>
            </div>
        </section>
    </main>

    <div id="loading" class="loading hidden" aria-hidden="true">Načítám…</div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
