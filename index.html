<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Soukromá mobilní PWA AR appka se zřetelnými šablonami tvarů, které si můžeš zarovnat přes kameru.">
    <title>Ohol Buchtu Studio</title>

    <link rel="manifest" href="%BASE_URL%manifest.json">
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg">
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg">
    <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
    <main class="app-shell" aria-labelledby="app-title">
        <section class="top-panel">
            <div class="brand-block">
                <p class="eyebrow">AR šablona</p>
                <h1 id="app-title">Ohol Buchtu</h1>
            </div>

            <div class="fun-panel compact" aria-live="polite">
                <div class="fun-panel-header">
                    <span id="template-label" class="template-pill">Bez šablony</span>
                    <strong id="template-vibe" class="fun-score">Vodítko 0/10</strong>
                </div>
                <div class="vibe-meter" aria-hidden="true">
                    <span id="vibe-fill"></span>
                </div>
                <p id="template-joke" class="fun-joke">Vyber tvar dole, zarovnej ho na kameru a podle obrysu se můžeš řídit.</p>
            </div>
        </section>

        <section class="stage-card" aria-label="AR náhled">
            <div id="video-container" class="video-container mirrored">
                <video id="video" autoplay playsinline muted aria-label="Živý náhled kamery"></video>
                <canvas id="canvas" class="overlay" aria-hidden="true"></canvas>
                <div id="empty-state" class="empty-state">
                    <strong>Kamera je vypnutá</strong>
                    <span>Vyber tvar šablony a klepni na Start.</span>
                </div>
            </div>
        </section>

        <section class="bottom-panel" aria-label="Ovládání aplikace">
            <select id="template-select" class="sr-only" aria-label="Vyber šablonu tvaru">
                <option value="none">Bez šablony</option>
                <option value="full">Full</option>
                <option value="brazilian">Brazilian</option>
                <option value="landing-strip">Landing Strip</option>
                <option value="triangle">Triangle</option>
                <option value="heart">Heart</option>
                <option value="lightning">Lightning</option>
                <option value="star">Star</option>
            </select>

            <div class="template-strip" aria-label="Viditelné šablony tvarů">
                <button class="shape-card active" type="button" data-template="none" aria-label="Bez šablony">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M18 46 L46 18 M18 18 L46 46"/></svg>
                    <span>Bez</span>
                </button>
                <button class="shape-card" type="button" data-template="full" aria-label="Full šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="17" y="12" width="30" height="42" rx="10"/></svg>
                    <span>Full</span>
                </button>
                <button class="shape-card" type="button" data-template="brazilian" aria-label="Brazilian šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="27" y="10" width="10" height="44" rx="5"/></svg>
                    <span>Brazil</span>
                </button>
                <button class="shape-card" type="button" data-template="landing-strip" aria-label="Landing strip šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="23" y="10" width="18" height="44" rx="6"/></svg>
                    <span>Strip</span>
                </button>
                <button class="shape-card" type="button" data-template="triangle" aria-label="Triangle šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 10 L52 52 H12 Z"/></svg>
                    <span>Tri</span>
                </button>
                <button class="shape-card" type="button" data-template="heart" aria-label="Heart šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 53 C18 41 10 32 14 22 C17 14 27 13 32 21 C37 13 47 14 50 22 C54 32 46 41 32 53 Z"/></svg>
                    <span>Heart</span>
                </button>
                <button class="shape-card" type="button" data-template="lightning" aria-label="Lightning šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M35 6 L18 34 H31 L25 58 L47 27 H34 Z"/></svg>
                    <span>Blesk</span>
                </button>
                <button class="shape-card" type="button" data-template="star" aria-label="Star šablona">
                    <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8 L38 24 H55 L41 34 L47 52 L32 41 L17 52 L23 34 L9 24 H26 Z"/></svg>
                    <span>Star</span>
                </button>
            </div>

            <div class="adjust-panel" aria-label="Doladění šablony">
                <button class="button micro" type="button" data-adjust="up">↑</button>
                <button class="button micro" type="button" data-adjust="down">↓</button>
                <button class="button micro" type="button" data-adjust="smaller">−</button>
                <button class="button micro" type="button" data-adjust="bigger">+</button>
                <button class="button micro ghost" type="button" data-adjust="reset">Reset</button>
            </div>

            <div class="button-row camera-row">
                <button id="start-camera" class="button primary" type="button">Start</button>
                <button id="stop-camera" class="button" type="button" disabled>Stop</button>
                <button id="switch-camera" class="button ghost" type="button">Zadní kamera</button>
            </div>

            <div class="button-row fun-row">
                <button id="random-template" class="button fun" type="button">🎲 Random</button>
                <button id="boost-vibe" class="button fun ghost" type="button">⚡ Zvýraznit</button>
                <button id="chaos-mode" class="button fun ghost" type="button">🪩 Chaos</button>
            </div>

            <div class="footer-controls">
                <label class="toggle">
                    <input id="mirror-toggle" type="checkbox" checked>
                    <span>Zrcadlit selfie</span>
                </label>
                <p id="status" class="status" role="status" aria-live="polite">Vyber viditelnou šablonu dole.</p>
            </div>
        </section>
    </main>

    <div id="loading" class="loading hidden" aria-hidden="true">Načítám…</div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
